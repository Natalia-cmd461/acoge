<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A3040">
  <meta name="description" content="Descarga el contenido de ACOGE para usarlo sin internet.">
  <title>Descargar contenido · ACOGE</title>

  <link rel="icon" href="img/iconos/icono-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/iconos/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Young+Serif&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla C · Descargar contenido -->
  <main class="instalar descargar">
    <h1 class="instalar__titulo descargar__titulo">Descargar contenido</h1>

    <button class="boton-blanco descargar__boton" id="descargar" type="button">Descargar</button>
    <button class="boton-blanco descargar__boton descargar__ahora-no" id="ahora-no" type="button">Ahora no</button>

    <p class="instalar__nota descargar__nota">El contenido estará disponible aun sin conexión a internet</p>
    <p class="instalar__nota descargar__nota descargar__nota--ios" id="nota-ios" hidden>En iPhone, el contenido solo se conserva si instalas acoge en la pantalla de inicio.</p>
    <p class="permisos__mensaje descargar__estado" id="estado" role="status"></p>
  </main>

  <script src="js/contenido.js"></script>
  <script src="js/registro-sw.js"></script>
  <script src="js/descargar.js"></script>
</body>
</html>
