<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A3040">
  <meta name="description" content="ACOGE te ayuda a prepararte para un sismo, a saber qué hacer durante y después, y a encontrar ayuda.">
  <title>Bienvenida · ACOGE</title>

  <link rel="icon" href="img/iconos/icono-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/iconos/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Young+Serif&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pantalla-vino">

  <!-- Pantalla A · Bienvenida (solo la primera vez) -->
  <main class="bienvenida">
    <header class="bienvenida__encabezado">
      <h1 class="bienvenida__titulo" aria-label="Bienvenido o bienvenida a ACOGE">
        <span class="bienvenida__saludo" aria-hidden="true">Bienvenido/a</span>
        <span class="bienvenida__nombre" aria-hidden="true">a acoge</span>
      </h1>
    </header>

    <section class="bienvenida__panel">
      <img class="bienvenida__forma" src="img/bienvenida-forma.svg" width="444" height="411" alt="">
      <p class="bienvenida__texto">
        ACOGE te ayuda a prepararte para un sismo, a saber qué hacer durante y después, y a encontrar ayuda. No es una alerta temprana: el aviso llega después de que el sismo fue detectado y reportado por fuentes oficiales.
      </p>
    </section>

    <footer class="bienvenida__pie">
      <!-- data-siguiente: pantalla que sigue. -->
      <button class="boton-vidrio" id="entendido" type="button" data-siguiente="instalar.html">Entendido</button>
    </footer>
  </main>

  <script src="js/registro-sw.js"></script>
  <script src="js/bienvenida.js"></script>
</body>
</html>
