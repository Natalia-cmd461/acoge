<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A3040">
  <meta name="description" content="Mapa ilustrado de la zona. Puedes moverlo y hacer zoom.">
  <title>Mapa de mi zona · ACOGE</title>

  <link rel="icon" href="img/iconos/icono-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/iconos/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700;800&family=Young+Serif&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Mesa 3,1-5 · Mapa de mi zona -->
  <main class="seccion mapa">
    <header class="seccion__encabezado">
      <img class="seccion__isotipo" src="img/isotipo-acoge-vino.png" width="45" height="49" alt="">
      <h1 class="seccion__titulo"><span class="seccion__titulo-1">Mapa</span><span class="seccion__titulo-2">de mi zona</span></h1>
    </header>

    <section class="mapa__tarjeta" data-mapa aria-label="Mapa ilustrado de la zona">
      <div class="mapa__visor" tabindex="0"
        aria-label="Mapa de la zona. Arrastra para moverlo y pellizca para acercar o alejar. Con el teclado: flechas para mover, más y menos para el zoom, cero para volver al inicio."
        aria-describedby="mapa-ayuda">
        <img class="mapa__imagen" alt="Mapa ilustrado de La Candelaria y el sur de Santa Fe con los puntos de la zona." draggable="false" hidden>
        <p class="mapa__vacio" hidden>El mapa de la zona todavía no está disponible.</p>
      </div>
      <div class="mapa__controles" role="group" aria-label="Zoom del mapa">
        <button class="mapa__control" type="button" data-accion="acercar" aria-label="Acercar">+</button>
        <button class="mapa__control" type="button" data-accion="alejar" aria-label="Alejar">−</button>
        <button class="mapa__control mapa__control--centrar" type="button" data-accion="centrar" aria-label="Volver a la vista inicial">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="3.2" fill="currentColor"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="10" r="6.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <p class="solo-lectores" id="mapa-ayuda">También puedes usar los botones de acercar, alejar y volver a la vista inicial.</p>
    </section>
  </main>

  <!-- Barra inferior: inicio, ficha, mapa y líneas de emergencia -->
  <nav class="barra-inferior barra-inferior--blanca" aria-label="Accesos rápidos">
    <div class="barra-inferior__grupo barra-inferior__grupo--cuatro">
      <a class="barra-inferior__enlace barra-inferior__enlace--inicio" href="inicio.html" aria-label="Inicio">
        <img src="img/nav-inicio.png" width="36" height="36" alt="">
      </a>
      <a class="barra-inferior__enlace barra-inferior__enlace--ficha" href="mi-ficha.html" aria-label="Mi ficha de emergencia">
        <img src="img/nav-ficha.png" width="35" height="36" alt="">
      </a>
      <a class="barra-inferior__enlace barra-inferior__enlace--mapa" href="mapa.html" aria-label="Mapa de mi zona" aria-current="page">
        <img src="img/nav-mapa.png" width="38" height="38" alt="">
      </a>
      <a class="barra-inferior__enlace barra-inferior__enlace--lineas" href="ayuda.html" aria-label="Líneas de emergencia">
        <img src="img/nav-lineas.png" width="43" height="40" alt="">
      </a>
    </div>
  </nav>

  <script src="js/registro-sw.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
